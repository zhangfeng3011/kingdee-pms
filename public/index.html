<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金蝶项目管理系统</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='16' cy='40' r='15' fill='%231f4fd8'/%3E%3Ccircle cx='46' cy='16' r='8' fill='%2338bdf8'/%3E%3Ccircle cx='44' cy='42' r='7' fill='%237c5cff'/%3E%3Ccircle cx='32' cy='14' r='4' fill='%2393c5fd'/%3E%3C/svg%3E">
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div id="loginPage" class="login-page hidden">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-text">
        <div class="brand-name">金蝶项目管理系统</div>
      </div>
    </div>
    <div class="login-tabs">
      <button id="tabLogin" class="tab active">登录</button>
      <button id="tabRegister" class="tab">注册</button>
    </div>
    <div class="login-form">
      <div class="field">
        <label>姓名</label>
        <input id="loginName" type="text" placeholder="请输入姓名" maxlength="20">
      </div>
      <div class="field">
        <label>密码</label>
        <input id="loginPassword" type="password" placeholder="请输入密码" maxlength="30">
      </div>
      <div id="loginMsg" class="form-msg"></div>
      <button id="loginBtn" class="btn btn-primary btn-block">登 录</button>
    </div>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span>金蝶项目管理系统</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <span id="currentUser" class="user-name"></span>
      <span class="footer-right">
        <button id="bellBtn" class="bell-btn" title="我的待办问题">🔔<span id="bellBadge" class="bell-badge hidden">0</span></button>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">退出</button>
      </span>
    </div>
  </aside>
  <main class="main">
    <div id="pageContent"></div>
  </main>
</div>

<!-- 通用弹窗 -->
<div id="modalMask" class="modal-mask hidden">
  <div class="modal" id="modalBox"></div>
</div>

<!-- 附件预览弹窗 -->
<div id="attachMask" class="modal-mask hidden">
  <div class="modal modal-lg" id="attachBox"></div>
</div>

<!-- 确认弹窗 -->
<div id="confirmMask" class="modal-mask hidden">
  <div class="modal modal-sm">
    <div class="modal-title">操作确认</div>
    <div class="modal-body" id="confirmText"></div>
    <div class="modal-footer">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn btn-danger" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
